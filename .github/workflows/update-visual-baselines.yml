name: Update visual baselines

# Regenerates visual-test baseline PNGs on the same macOS runner image that CI
# uses for comparison, and commits them to the branch the workflow was run on.
# Trigger it (from a feature branch, never main) when the UI intentionally
# changes:   gh workflow run update-visual-baselines.yml --ref <branch>
#
# The baseline commit is pushed with GITHUB_TOKEN, which GitHub excludes from
# triggering workflows (recursion guard), so `pull_request` never fires for it.
# The final step below therefore dispatches CI explicitly on the new HEAD — no
# manual follow-up push is needed any more.
on:
  workflow_dispatch:

permissions:
  contents: write
  # to dispatch the CI workflow on the commit this one pushes
  actions: write

jobs:
  update-baselines:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Baselines must be updated via a PR branch, not directly on main."
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: visual-tests

      - name: Generate baselines
        run: UPDATE_BASELINE=1 cargo run -p file-explorer-app --bin visual_test_runner --features visual-tests

      - name: Upload baselines as artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: crates/app/test_fixtures/visual_tests/

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/app/test_fixtures/visual_tests
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
          else
            git commit -m "Update visual test baselines [skip-checks]

          Generated by the update-visual-baselines workflow on macos-latest."
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # A GITHUB_TOKEN push does not fire `pull_request`, so CI would never run
      # on the commit above and the PR would sit at "no checks reported" —
      # unmergeable, with nothing obviously wrong. Start it explicitly.
      - name: Start CI on the pushed baselines
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
