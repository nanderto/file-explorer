name: Release

# Tag-driven: `git tag v0.1.0 && git push origin v0.1.0` builds the app and
# attaches it to a GitHub Release. Nothing publishes from a branch push, so a
# release is always a deliberate act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The same script you run locally, so "it bundles on CI only" cannot
      # happen (scripts/bundle.sh).
      - name: Bundle
        run: ./scripts/bundle.sh --dmg

      - name: Check the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --title "File Explorer $TAG" \
            --notes "$(cat <<'NOTES'
### Install

1. Download the `.dmg`, open it, and drag **File Explorer** to Applications.
2. Open it once. macOS will refuse, because this build is **not notarised**.
3. Go to **System Settings → Privacy & Security**, scroll to **Security**, and
   click **Open Anyway** next to the message about File Explorer. Confirm.

You only need that once.

> Right-click → Open no longer works for this: macOS 15 removed that bypass
> for software that is not notarised. System Settings is the way now.

If you would rather use the Terminal, this does the same thing in one step:

```
xattr -dr com.apple.quarantine "/Applications/File Explorer.app"
```

**Why the warning?** Notarising requires an Apple Developer Program
membership. The app is ad-hoc signed, so the bundle is intact and macOS can
verify it has not been tampered with since it was built — but Apple has not
vouched for it, and macOS says so.
NOTES
)" \
            "target/bundle/FileExplorer-$VERSION.dmg" \
            || gh release upload "$TAG" "target/bundle/FileExplorer-$VERSION.dmg" --clobber
