name: Release

# Tag-driven: `git tag v0.1.0 && git push origin v0.1.0` builds the app and
# attaches it to a GitHub Release. Nothing publishes from a branch push, so a
# release is always a deliberate act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The same script you run locally, so "it bundles on CI only" cannot
      # happen (scripts/bundle.sh).
      - name: Bundle
        run: ./scripts/bundle.sh --dmg

      # A tag may carry a pre-release suffix — `v0.1.0-beta.1` — but its
      # numeric part must still match Cargo.toml, or the download would report
      # a version the app does not.
      - name: Check the version matches the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          BASE="${TAG#v}"           # v0.1.0-beta.1 -> 0.1.0-beta.1
          NUM="${BASE%%-*}"         #                  -> 0.1.0
          if [ "$NUM" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          # Anything after the first `-` makes this a pre-release, which
          # GitHub should label as such rather than offering it as "Latest".
          if [ "$BASE" = "$NUM" ]; then
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" ${{ steps.version.outputs.prerelease }} \
            --title "File Explorer $TAG" \
            --notes-file .github/release-notes.md \
            "target/bundle/FileExplorer-$VERSION.dmg" \
            || gh release upload "$TAG" "target/bundle/FileExplorer-$VERSION.dmg" --clobber
