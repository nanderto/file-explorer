name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the update-visual-baselines workflow start CI on its own commit.
  # Baselines are pushed with GITHUB_TOKEN, which GitHub excludes from
  # triggering workflows, so `pull_request` never fires for them and the
  # required CI check would otherwise never run on that HEAD.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect cargo workspace
        id: detect
        run: echo "has_cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache cargo
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Format check
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo fmt --all --check

      - name: Build (workspace, all targets)
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo build --workspace --all-targets

      - name: Clippy (warnings are errors)
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests (lib targets)
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --workspace --lib --bins

      - name: Integration + UI tests (tests/ targets and #[gpui::test])
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --workspace

      - name: Check visual-test runner compiles
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo check -p file-explorer-app --features visual-tests

  visual-tests:
    name: Visual regression tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect cargo workspace
        id: detect
        run: echo "has_cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: visual-tests

      - name: Run visual regression tests
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo run -p file-explorer-app --bin visual_test_runner --features visual-tests

      - name: Upload screenshots and diffs
        if: always() && steps.detect.outputs.has_cargo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-output
          path: target/visual_tests/
          if-no-files-found: ignore

  docs-and-tests-updated:
    name: Docs & tests accompany code
    runs-on: ubuntu-latest
    # Runs for workflow_dispatch too. The aggregate `ci` job below treats a
    # skipped job as acceptable, so letting this one skip on dispatch would let
    # a baseline-triggered CI pass without the docs/tests check ever running.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AS_BUILT.md and tests were updated with code
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-checks') }}
        # base_ref is empty outside a pull_request, so fall back to main.
        run: bash scripts/gate.sh ci-diff "origin/${{ github.base_ref || 'main' }}"

  # Aggregate check — the ONLY required status check in branch protection.
  # Requiring this single "CI" context means adding/renaming jobs above never
  # requires touching the branch-protection config (just add them to `needs`).
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build-and-test, visual-tests, docs-and-tests-updated]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required job failed or was cancelled"; exit 1 ;;
            esac
          done
