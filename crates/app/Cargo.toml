[package]
name = "file-explorer-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "file_explorer_app"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

# Visual regression test runner (macOS only at runtime; compiles everywhere).
# Run:            cargo run -p file-explorer-app --bin visual_test_runner --features visual-tests
# Update baseline: UPDATE_BASELINE=1 cargo run -p file-explorer-app --bin visual_test_runner --features visual-tests
[[bin]]
name = "visual_test_runner"
path = "src/bin/visual_test_runner.rs"
required-features = ["visual-tests"]

[features]
# fs-core/test-support: the visual runner renders deterministic FakeVfs
# fixture trees, never the real filesystem (ARCHITECTURE.md §9).
visual-tests = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "fs-core/test-support",
]

[dependencies]
anyhow.workspace = true
# Platform config dir for settings.json (env lookup only — no disk I/O).
dirs = "6"
fs-core = { path = "../fs-core" }
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
once_cell.workspace = true
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation.workspace = true

[dev-dependencies]
# A test `Platform` that records thumbnail requests implements the same
# `#[async_trait]` trait fs-core declares.
async-trait = "0.1"
fs-core = { path = "../fs-core", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
serde_json = "1"
