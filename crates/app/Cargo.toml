[package]
name = "file-explorer-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "file_explorer_app"
path = "src/lib.rs"

[[bin]]
name = "file-explorer"
path = "src/main.rs"

# Visual regression test runner (macOS only at runtime; compiles everywhere).
# Run:            cargo run -p file-explorer-app --bin visual_test_runner --features visual-tests
# Update baseline: UPDATE_BASELINE=1 cargo run -p file-explorer-app --bin visual_test_runner --features visual-tests
[[bin]]
name = "visual_test_runner"
path = "src/bin/visual_test_runner.rs"
required-features = ["visual-tests"]

[features]
# fs-core/test-support + serde_json: the visual runner renders deterministic
# FakeVfs fixture trees, never the real filesystem (ARCHITECTURE.md §9).
visual-tests = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "fs-core/test-support",
    "dep:serde_json",
]

[dependencies]
anyhow.workspace = true
fs-core = { path = "../fs-core" }
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
once_cell.workspace = true
regex.workspace = true
serde_json = { version = "1", optional = true }
unicode-segmentation.workspace = true

[dev-dependencies]
fs-core = { path = "../fs-core", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
serde_json = "1"
