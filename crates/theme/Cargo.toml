[package]
name = "file-explorer-theme"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "theme"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
# `Hsla` is gpui's color type; every widget consumes these values directly, so
# the theme model speaks gpui rather than converting at each call site. Nothing
# else of gpui is used here — no windows, no entities, no rendering.
gpui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
