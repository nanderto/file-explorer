[package]
name = "fs-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Exposes FakeVfs and TestSpawner to downstream crates' tests. This crate's own
# unit tests see them unconditionally via cfg(any(test, feature = "test-support")).
test-support = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
async-channel = "2"
async-trait = "0.1"
fs4 = "0.13"
futures = "0.3"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
# atomic_write: temp-in-same-dir + persist (ARCHITECTURE.md §6).
tempfile = "3"

# macOS platform services (plan §4: NSFileManager mounted volumes via objc2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }

[dev-dependencies]
serde_json = "1"
