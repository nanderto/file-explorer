[package]
name = "fs-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Exposes FakeVfs and TestSpawner to downstream crates' tests. This crate's own
# unit tests see them unconditionally via cfg(any(test, feature = "test-support")).
test-support = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
async-channel = "2"
async-trait = "0.1"
fs4 = "0.13"
futures = "0.3"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
