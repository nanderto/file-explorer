[package]
name = "fs-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Exposes FakeVfs and TestSpawner to downstream crates' tests. This crate's own
# unit tests see them unconditionally via cfg(any(test, feature = "test-support")).
test-support = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
async-channel = "2"
async-trait = "0.1"
fs4 = "0.13"
futures = "0.3"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
# atomic_write: temp-in-same-dir + persist (ARCHITECTURE.md §6).
tempfile = "3"

# macOS platform services (plan §4: NSFileManager mounted volumes via objc2,
# QuickLookThumbnailing for real thumbnails with an `image`-crate fallback).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }
objc2-quick-look-thumbnailing = { version = "0.3", features = [
    "QLThumbnailGenerationRequest",
    "QLThumbnailGenerator",
    "QLThumbnailRepresentation",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
# Fallback decoder when QuickLook declines a file (plan §4 names exactly this
# fallback). Extra decoders beyond the workspace default `png`.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "tiff", "webp"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    # M6b Finder tags: NSPropertyListSerialization (+ its NSData currency type)
    # writes the binary plist Finder stores in _kMDItemUserTags and reads back
    # either binary or XML. Features on an existing dependency, not a new crate.
    "NSData",
    "NSPropertyList",
    # NSDate: M5 reads NSURLAddedToDirectoryDateKey ("Date Added") as an NSDate.
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }

[dev-dependencies]
serde_json = "1"
# Integration tests (tests/torture.rs) see the crate as a dependency, not
# under cfg(test) — the self-dependency turns test-support on for them.
fs-core = { path = ".", features = ["test-support"] }
